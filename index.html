<!DOCTYPE html>
<html lang="ru" data-theme="light" data-style="glass">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Потеряшки 575 — Цифровая Платформа</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar">
        <div class="logo">📦 Потеряшки 575</div>
        <button class="menu-btn" onclick="openMenu()">☰ Меню</button>
    </header>

    <main class="container">
        
        <section class="stats-grid">
            <div class="stat-card">
                <h3>Всего вещей:</h3>
                <p id="statTotal">0</p>
            </div>
            <div class="stat-card lost">
                <h3>Ищут (LOST):</h3>
                <p id="statLost">0</p>
            </div>
            <div class="stat-card found">
                <h3>Найдено (FOUND):</h3>
                <p id="statFound">0</p>
            </div>
        </section>

        <section class="filters-panel">
            <input type="text" id="search" placeholder="Начни вводить название вещи..." oninput="render()">
            <div class="selectors">
                <select id="filterStatus" onchange="render()">
                    <option value="all">Все объявления</option>
                    <option value="lost">Только утерянное (LOST)</option>
                    <option value="found">Только найденное (FOUND)</option>
                </select>
                <select id="filterCategory" onchange="render()">
                    <option value="all">Все категории предметов</option>
                    <option value="Одежда">Одежда и обувь</option>
                    <option value="Электроника">Электроника (телефоны, наушники)</option>
                    <option value="Канцелярия">Канцелярия и учебники</option>
                    <option value="Другое">Прочее</option>
                </select>
            </div>
        </section>

        <section class="items-grid" id="itemsList">
            </section>
    </main>

    <div class="overlay" id="overlay" onclick="closeMenu()"></div>

    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h2>Управление</h2>
            <button class="close-btn" onclick="closeMenu()">×</button>
        </div>

        <div id="loginForm" class="menu-section">
            <h3>Вход в систему</h3>
            <input type="text" id="loginName" placeholder="Логин (например: завуч, учитель)">
            <input type="password" id="loginPass" placeholder="Пароль">
            <button class="btn-primary" onclick="loginUser()">Войти</button>
        </div>

        <div id="loggedInState" class="menu-section" style="display: none;">
            <div class="user-profile">
                <img id="userAvatar" src="" alt="Аватар">
                <div class="user-text">
                    <p id="currentUserInfo"></p>
                    <button class="btn-secondary" onclick="logoutUser()">Выйти</button>
                </div>
            </div>
        </div>

        <div id="addItemForm" class="menu-section" style="display: none;">
            <h3>Добавить новую вещь</h3>
            <input type="text" id="itemName" placeholder="Название предмета (например: Ключи)">
            <select id="itemCat">
                <option value="Одежда">Одежда и обувь</option>
                <option value="Электроника">Электроника</option>
                <option value="Канцелярия">Канцелярия</option>
                <option value="Другое">Другое</option>
            </select>
            <select id="itemStatus">
                <option value="lost">Утеряно (LOST)</option>
                <option value="found">Найдено (FOUND)</option>
            </select>
            <input type="text" id="itemLocation" placeholder="Где нашли / потеряли (каб. 34)">
            <button class="btn-success" onclick="addItem()">Опубликовать на сайт</button>
        </div>

        <div id="studentForm" class="menu-section">
            <h3>Сообщить дежурным</h3>
            <p class="hint">Напиши нам, если что-то потерял, и дежурные добавят это в базу.</p>
            <input type="text" placeholder="Твоё имя, Фамилия и Класс">
            <textarea placeholder="Что потерял, какого цвета и где примерно..."></textarea>
            <button class="btn-success" onclick="alert('Ваше сообщение отправлено дежурным администраторам!')">Отправить дежурным</button>
        </div>

        <div class="menu-section settings-section">
            <h3>Внешний вид платформы</h3>
            <label>Визуальный стиль:</label>
            <select id="themeSelector" onchange="changeStyleTheme()">
                <option value="glass">🔮 Жидкое стекло (Liquid Glass)</option>
                <option value="cyberpunk">⚡ Неоновый Киберпанк</option>
                <option value="terminal">📟 Матрица (Ретро-терминал)</option>
                <option value="nordic">❄️ Скандинавский минимализм</option>
            </select>
            <button class="btn-secondary" style="margin-top: 10px; width:100%;" onclick="toggleTheme()">Сменить режим День/Ночь</button>
        </div>

        <div id="adminControls" class="menu-section admin-panel" style="display: none;">
            </div>
    </aside>

    <script src="script.js"></script>
</body>
</html>
